##
## ServiceAccount with IRSA (IAM Roles for Service Accounts)
##
## The annotation binds this k8s ServiceAccount to an AWS IAM Role.
## Pods using this SA get short-lived AWS credentials via a projected
## service account token — no access keys, no shared node instance profile.
##
## IAM role must be created first (eksctl creates it via iam.serviceAccounts
## in eksctl-cluster.yaml, or create manually with trust policy referencing
## the cluster OIDC provider).
##
## Trust policy on the IAM role must allow:
##   Principal: arn:aws:iam::ACCOUNT_ID:oidc-provider/oidc.eks.REGION.amazonaws.com/id/OIDC_ID
##   Condition: StringEquals
##     "token.actions.githubusercontent.com:sub": system:serviceaccount:ghost-prod:ghost
##
## The role needs these policies attached:
##   - SecretsManagerReadWrite (scoped to ghost/* secrets only)
##   - AmazonS3FullAccess (scoped to your ghost-uploads bucket)
##   - (no EC2/EKS policies — pods should never have node-level AWS access)
##
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ghost
  namespace: ghost-prod
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/ghost-prod-sa-role
    # Token expiry — shorter = more secure; default 86400s (24h)
    eks.amazonaws.com/token-expiration: "3600"
