##
## ExternalSecret — pulls from AWS Secrets Manager into a k8s Secret
##
## AWS Secrets Manager layout assumed:
##   ghost/db        → {"password": "...", "user": "ghost"}
##   ghost/smtp      → {"user": "AKIAXXXXXXX", "pass": "..."}
##   ghost/content   → {"key": "..."}   (Ghost content encryption key)
##
## ESO syncs on the refreshInterval. The resulting k8s Secret is named
## ghost-secrets and has the same keys your Deployment's env vars reference.
##
## To create the secrets in Secrets Manager:
##   aws secretsmanager create-secret --name ghost/db \
##     --secret-string '{"password":"STRONG_PASS","user":"ghost"}'
##
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghost-secrets
  namespace: ghost-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: ghost-secrets        # name of the k8s Secret ESO creates/manages
    creationPolicy: Owner      # ESO owns this Secret; deletes it when ExternalSecret is deleted
    template:
      type: Opaque
  data:
    - secretKey: mysql-ghost-password
      remoteRef:
        key: ghost/db
        property: password
    - secretKey: mysql-ghost-user
      remoteRef:
        key: ghost/db
        property: user
    - secretKey: smtp-user
      remoteRef:
        key: ghost/smtp
        property: user
    - secretKey: smtp-pass
      remoteRef:
        key: ghost/smtp
        property: pass
