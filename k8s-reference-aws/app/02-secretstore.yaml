##
## External Secrets Operator — SecretStore
##
## A SecretStore tells ESO where to pull secrets from and how to authenticate.
## ClusterSecretStore = cluster-wide; SecretStore = namespace-scoped (use this in prod).
##
## ESO controller uses the ghost ServiceAccount's IRSA role to call Secrets Manager —
## no AWS keys stored in the cluster anywhere.
##
## Prerequisite: External Secrets Operator installed (see addons/install.sh).
##
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: ghost-prod
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      # Use the ghost ServiceAccount's IRSA role for auth
      auth:
        jwt:
          serviceAccountRef:
            name: ghost
