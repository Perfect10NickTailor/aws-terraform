##
## Karpenter NodePool + EC2NodeClass — production
##
## Applied after: helm install karpenter (see addons/install.sh)
## Karpenter watches for unschedulable pods and provisions EC2 directly —
## faster than cluster-autoscaler (seconds, not minutes) and smarter about
## instance type selection (picks cheapest that fits the pod's requests).
##
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  # AL2 = Amazon Linux 2 — well-tested with EKS; AL2023 is the newer option
  amiFamily: AL2
  # Role that Karpenter-launched nodes assume (separate from the system node group role)
  role: KarpenterNodeRole-prod-cluster   # created by install.sh
  # Karpenter discovers subnets + SGs via the tag set on the cluster in eksctl-cluster.yaml
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: prod-cluster
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: prod-cluster
  # Encrypt root volume — required in most compliance contexts
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        encrypted: true
  # userData can inject extra bootstrap flags; usually empty
  # userData: |
  #   #!/bin/bash
  #   /etc/eks/bootstrap.sh prod-cluster
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    metadata:
      labels:
        role: application
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      # Spot first, fall back to on-demand — Karpenter handles interruption via SQS
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        # Diverse instance family list improves spot availability
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - m5.large
            - m5.xlarge
            - m5.2xlarge
            - m6i.large
            - m6i.xlarge
            - m6i.2xlarge
            - c5.xlarge
            - c5.2xlarge
        - key: topology.kubernetes.io/zone
          operator: In
          values: [us-east-1a, us-east-1b, us-east-1c]
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
  # Hard cap — prevents runaway costs if HPA bugs out
  limits:
    cpu: 200
    memory: 800Gi
  # WhenEmptyOrUnderutilized: consolidate nodes proactively, not just when empty.
  # consolidateAfter: how long to wait before acting on an underutilized node.
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 2m
    # Budgets prevent Karpenter from disrupting too many nodes at once during consolidation
    budgets:
      - nodes: "20%"
